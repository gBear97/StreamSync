name: Release

# Publishes a GitHub Release, which is what the in-app updater reads. Its
# shape matters: one .dmg per architecture, named the way CI names every
# other build, plus a SHA256SUMS the updater checks each download against
# before installing anything.
#
# Two ways in, both requiring the tag to agree with version.py:
#   - push a tag:  git tag v1.0.1 && git push origin v1.0.1
#   - Actions tab: Release > Run workflow > enter v1.0.1
#
# The manual route exists because creating the release also creates the
# tag, so a release can be cut without a local clone or push rights.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.0.1 (must match version.py)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tag is the release's identity, so it must agree with the
      # version baked into the app - otherwise the updater would offer an
      # update that reports a different version once installed, and go on
      # offering it forever.
      - name: Check the tag matches version.py
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          FILE=$(python3 -c 'from version import __version__; print(__version__)')
          if [ "$FILE" != "${TAG#v}" ]; then
            echo "Tag $TAG means ${TAG#v}, but version.py says $FILE."
            echo "Bump version.py to match, or use a different tag."
            exit 1
          fi
          echo "VERSION=$FILE" >> "$GITHUB_ENV"
          echo "DMG=StreamSync-$FILE-${{ matrix.arch }}-$(git rev-parse --short HEAD).dmg" >> "$GITHUB_ENV"
          echo "Publishing $TAG as StreamSync $FILE"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python3 test_matcher.py
          python3 test_audio_matcher.py
          python3 test_updater.py

      - name: Build StreamSync.app
        run: sh build_app_mac.sh

      - name: Package as a disk image
        run: |
          hdiutil create -volname "StreamSync $VERSION" \
            -srcfolder dist/StreamSync.app -fs HFS+ -ov -format UDZO "$DMG"

      - name: Verify the disk image mounts and the app is intact
        run: |
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -readonly
          test -x "$MNT/StreamSync.app/Contents/MacOS/StreamSync" \
            || { echo "main binary missing or not executable"; exit 1; }
          hdiutil detach "$MNT"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: ${{ env.DMG }}
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
          path: dist

      # The updater refuses any download it cannot match here, so a
      # release without this file installs nothing.
      - name: Checksum the disk images
        working-directory: dist
        run: |
          sha256sum *.dmg | tee SHA256SUMS
          ls -lh

      # --target pins the tag to this commit, so the manual route creates
      # the tag as part of publishing rather than needing one up front.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "StreamSync $TAG" \
            --generate-notes \
            dist/*.dmg dist/SHA256SUMS
          echo "Published: $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url)"
