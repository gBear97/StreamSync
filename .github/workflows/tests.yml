name: Tests

# Every test, on every platform StreamSync runs on, for every pull request.
#
# Until this existed nothing ever ran on Windows - the platform the README
# lists first - and two engine test files were never run anywhere. The
# macOS build workflow still does the packaging checks; this is the fast
# "is the engine right" gate.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # constraints.txt holds every run to the versions the releases are
      # built with, so a new upload to PyPI arrives as a pull request that
      # raises a pin, not unannounced in a test run.
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt

      # test_videomouse checks that a click over the picture reaches our
      # window and not libvlc's own (vout_hits). That takes a real 64-bit
      # libvlc playing into the window; without VLC it skips, and the
      # check had only ever run on the PC. ci/install_vlc.ps1 takes it from
      # VideoLAN at a pinned version and checksum: Chocolatey, which this
      # used before, failed whole runs whenever its feed was down.
      - name: Install VLC
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/install_vlc.ps1

      # test_ui builds every screen under real Tk. The Linux runner has no
      # display, so it gets a virtual one - at 24-bit colour: xvfb-run's
      # default is 8-bit, which Tk would draw (and the screenshots show)
      # in a dithered palette.
      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      # Engine, capture timing, controller decisions, fingerprints, the
      # relay, a whole watch party, how a viewer follows a host's plays,
      # pauses and jumps (test_follow), hosting through a Cloudflare tunnel with
      # stand-ins for GitHub and cloudflared (test_tunnel), the shell over a fake Tk (test_macswap,
      # and test_winswap with Windows' adapter over a fake windowctl) and
      # the update flow over a fake updater - none needs a sound card,
      # a display or VLC. test_singleinstance holds locks of its own and
      # runs streamsync.py beside them; its --selftest tours the real app
      # where VLC is installed (Windows) and stops at the gate elsewhere.
      # test_widgets and test_ui draw the real controls
      # and screens: they skip where there is no display, and test_ui runs
      # under a virtual one on Linux. (test_windowctl / test_macwindowctl /
      # test_videomouse drive real windows and skip themselves off their
      # platform: test_videomouse runs the film window's mouse controls,
      # keys and bar on Windows and, with the Mac's bindings, on macOS,
      # and skips on Linux. Its libvlc hit-test is Windows-only and also
      # skips where VLC is not installed.)
      - name: Engine, session and UI tests
        shell: bash
        env:
          # each screen as a PNG, to hold up against the approved boards
          # (test_widgets reads the older name of the same setting)
          STREAMSYNC_SHOTS: ${{ runner.temp }}/ui-shots
          STREAMSYNC_SCREENSHOTS: ${{ runner.temp }}/ui-shots
        run: |
          set -e
          for t in test_audio_capture test_picture_timing test_players test_controller \
                   test_audio_matcher test_fingerprint test_relay \
                   test_relay_tls test_session test_follow test_tunnel test_updater test_netcerts \
                   test_diagnostics test_singleinstance test_macswap \
                   test_winswap test_windowctl test_videomouse \
                   test_widgets test_updateflow test_ui; do
            echo "=== $t"
            if [ "$t" = test_ui ] && [ "$RUNNER_OS" = Linux ] && [ -z "$DISPLAY" ]; then
              xvfb-run -a -s "-screen 0 1280x1024x24" python "$t.py"
            else
              python "$t.py"
            fi
          done

      # Small PNGs kept for a week, failed runs included: a broken screen
      # is when they are wanted most.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-shots-${{ matrix.os }}
          path: ${{ runner.temp }}/ui-shots
          if-no-files-found: ignore
          retention-days: 7

  windows-app:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt

      # The Windows window builds an embedded libvlc player as it opens,
      # so the smoke test needs a real 64-bit VLC (see ci/install_vlc.ps1).
      - name: Install VLC
        shell: pwsh
        run: ./ci/install_vlc.ps1

      # The way a user starts it: through the dependency gate (which, under
      # --selftest, fails the run instead of waiting on its dialog), then
      # the real main window, every dialog opened and closed once, and the
      # real close path after 3 s, with a throwaway config. Catches anything
      # that throws while the UI and the controller are wired together.
      - name: Smoke-test the main window
        timeout-minutes: 3
        run: python streamsync.py --selftest

      - name: Build StreamSync.exe
        shell: pwsh
        run: ./build_exe.ps1

      # Pull requests prove the build works; only main publishes it. The
      # account's artifact storage is finite (it once filled up and failed
      # an otherwise green run), and a 1,100-file build per PR push is
      # the quickest way to fill it.
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: StreamSync-windows-${{ github.sha }}
          path: dist/StreamSync
          if-no-files-found: error
          retention-days: 14
