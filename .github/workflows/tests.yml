name: Tests

# Every test, on every platform StreamSync runs on, for every pull request.
#
# Until this existed nothing ever ran on Windows - the platform the README
# lists first - and two engine test files were never run anywhere. The
# macOS build workflow still does the packaging checks; this is the fast
# "is the engine right" gate.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Engine, capture timing, controller decisions, fingerprints, the
      # relay and a whole watch party - none needs a sound card, a display
      # or VLC. (test_windowctl / test_macwindowctl drive real windows and
      # skip themselves off their platform.)
      - name: Engine and session tests
        shell: bash
        run: |
          set -e
          for t in test_audio_capture test_controller test_matcher \
                   test_audio_matcher test_fingerprint test_relay \
                   test_session test_updater test_netcerts test_diagnostics \
                   test_windowctl; do
            echo "=== $t"
            python "$t.py"
          done

  windows-app:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # The Windows window builds an embedded libvlc player as it opens,
      # so the smoke test needs a real 64-bit VLC.
      - name: Install VLC
        run: choco install vlc --no-progress -y

      # Builds the real main window, lets it run for 3 s and closes it:
      # catches anything that throws while the UI and the controller are
      # wired together, on the platform no one had been testing.
      - name: Smoke-test the main window
        timeout-minutes: 3
        run: python app.py --selftest

      - name: Build StreamSync.exe
        shell: pwsh
        run: ./build_exe.ps1

      # Pull requests prove the build works; only main publishes it. The
      # account's artifact storage is finite (it once filled up and failed
      # an otherwise green run), and a 1,100-file build per PR push is
      # the quickest way to fill it.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: StreamSync-windows-${{ github.sha }}
          path: dist/StreamSync
          if-no-files-found: error
          retention-days: 14
