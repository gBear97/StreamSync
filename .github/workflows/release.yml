name: Release

# Publishes a GitHub Release, which is what the in-app updater reads. Its
# shape matters: one .dmg per Mac architecture and one Windows installer
# (build-windows.yml), named the way CI names every other build, plus a
# SHA256SUMS the updater checks each download against and SHA256SUMS.sig,
# the release key's signature over it (ci/sign_sums.sh). An app refuses a
# release whose checksums that key did not sign, so the secret
# RELEASE_SIGNING_KEY is checked before anything is built.
#
# Two ways in, both requiring the tag to agree with version.py and the
# release's notes to be in release-notes/<tag>.md:
#   - push a tag:  git tag v1.0.1 && git push origin v1.0.1
#   - Actions tab: Release > Run workflow > enter v1.0.1
#
# The manual route exists because creating the release also creates the
# tag, so a release can be cut without a local clone or push rights.
#
# The disk images travel from the build jobs to the publish job on a
# draft release, not as Actions artifacts: artifacts count against the
# account's storage quota, which once filled up and would have failed a
# release after it had been signed and notarized. Drafts are invisible to
# the updater (it reads /releases/latest), so users never see a release
# until it is complete, and a failed run leaves a draft the next run of
# the same commit picks up again (a run of a newer commit starts afresh).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.0.1 (must match version.py)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Open a draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Checked here as well as in each build, so a mismatched tag never
      # leaves a stray draft behind.
      - name: Check the tag matches version.py
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          FILE=$(python3 -c 'from version import __version__; print(__version__)')
          if [ "$FILE" != "${TAG#v}" ]; then
            echo "Tag $TAG means ${TAG#v}, but version.py says $FILE."
            echo "Bump version.py to match, or use a different tag."
            exit 1
          fi

      # The publish job needs it hours from now, after both Macs have been
      # notarized: say so in seconds instead.
      - name: Check the release signing key is present
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "Missing repository secret: RELEASE_SIGNING_KEY"
            echo "Add it at Settings > Secrets and variables > Actions, with"
            echo "that exact name. Releases are signed, so it is not optional."
            exit 1
          fi
          echo "The release signing key is present."

      # What the release says is release-notes/<tag>.md, merged with the
      # version bump. The draft used to get GitHub's generated list of
      # pull requests instead, and the file had to be swapped in by hand
      # with `gh release edit` before the publish job made it public -
      # which every release needed and nothing enforced. A missing file
      # stops the run here, before anything is built.
      - name: Check the release notes are written
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          NOTES="release-notes/$TAG.md"
          if [ ! -s "$NOTES" ]; then
            echo "There is no $NOTES (or it is empty) in this commit."
            echo "Write what users get in $TAG there, merge it with the"
            echo "version bump, and run the release again."
            exit 1
          fi
          echo "The release notes are $NOTES."

      # A draft an earlier run left is reused only if that run was of this
      # same commit, and its notes are refreshed from the file. A draft
      # opened for another commit - the release run again after a fix was
      # merged - is deleted and opened afresh. Its builds' names carry that
      # commit, so this run's uploads would sit beside them instead of
      # replacing them, and the publish job, which wants exactly one of
      # each, would fail after both Macs had been notarized. Its target
      # would also have put the tag on a commit this run never built.
      - name: Create the draft, or reuse one an earlier run left
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          NOTES="release-notes/$TAG.md"
          # --target pins the tag to this commit; the tag itself is
          # created when the draft is published.
          create() {
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --target "$GITHUB_SHA" --title "StreamSync $TAG" --notes-file "$NOTES"
          }
          if found=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                       --json isDraft,targetCommitish \
                       -q '"\(.isDraft) \(.targetCommitish)"' 2>/dev/null); then
            read -r draft target <<< "$found"
            if [ "$draft" != "true" ]; then
              echo "$TAG is already published. Bump version.py and use a new tag."
              exit 1
            fi
            if [ "$target" = "$GITHUB_SHA" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"
              echo "Reusing the draft $TAG left by an earlier run of this commit, with the notes in $NOTES."
            else
              echo "The draft $TAG was opened for $target, not $GITHUB_SHA."
              echo "Deleting it, and the builds that run attached, and opening a new one."
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
              create
            fi
          else
            create
          fi

  build:
    name: Build (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    # Two notarizations happen in this job and each may wait 75m on
    # Apple, so the budget has to clear 150m before the build is even
    # counted. It was once 30 - the same as a single wait - and the job
    # was duly cancelled at exactly 30 minutes with notarytool still
    # running and nothing logged. A job budget has to exceed the sum of
    # what its steps may take, not match one of them.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The tag is the release's identity, so it must agree with the
      # version baked into the app - otherwise the updater would offer an
      # update that reports a different version once installed, and go on
      # offering it forever.
      - name: Check the tag matches version.py
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          FILE=$(python3 -c 'from version import __version__; print(__version__)')
          if [ "$FILE" != "${TAG#v}" ]; then
            echo "Tag $TAG means ${TAG#v}, but version.py says $FILE."
            echo "Bump version.py to match, or use a different tag."
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$FILE" >> "$GITHUB_ENV"
          echo "DMG=StreamSync-$FILE-${{ matrix.arch }}-$(git rev-parse --short HEAD).dmg" >> "$GITHUB_ENV"
          echo "Publishing $TAG as StreamSync $FILE"

      # Fail in seconds on a missing secret rather than ten minutes later
      # at the signing step, with a message naming what to add.
      #
      # These env names deliberately match the secret names exactly. They
      # used to be shorter aliases, and the failure then read "Missing
      # repository secret(s): P12 ..." - naming something that cannot be
      # found in the settings page, which is the one place the message is
      # read. What it prints must be what you paste.
      - name: Check the signing secrets are present
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=""
          for v in MACOS_CERT_P12 MACOS_CERT_PASSWORD NOTARY_KEY_P8 \
                   NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            eval "val=\$$v"
            [ -n "$val" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing"
            echo ""
            echo "Add them at Settings > Secrets and variables > Actions >"
            echo "New repository secret, using exactly the names above."
            echo "Releases are signed and notarized, so none are optional."
            exit 1
          fi
          echo "All five signing secrets are present."

      # The versions in constraints.txt, so what ships is what CI tested.
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt -c constraints.txt

      - name: Run tests
        run: |
          python3 test_audio_capture.py
          python3 test_players.py
          python3 test_controller.py
          python3 test_audio_matcher.py
          python3 test_fingerprint.py
          python3 test_relay.py
          python3 test_relay_tls.py
          python3 test_session.py
          python3 test_updater.py
          python3 test_netcerts.py
          python3 test_diagnostics.py

      - name: Build StreamSync.app
        run: sh build_app_mac.sh

      # A keychain of our own, unlocked only for this job, so the
      # certificate never touches the runner's default keychain.
      #
      # It must stay unlocked for the whole job: the disk image is signed
      # with it only after the app's notarization, which ci/notarize.sh
      # may wait 75 minutes for. The lock timeout was once 900 s, so a
      # slow day at Apple would have failed the release at the image's
      # codesign, after a notarization had been spent. 21600 s is six
      # hours, the most any GitHub-hosted job may run - longer than this
      # job's own 180 minutes, so the keychain cannot lock before the
      # runner is torn down.
      - name: Import the signing certificate
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          # Let codesign use the key without an interactive prompt, which
          # nothing could answer on a runner.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          # Show what actually arrived before judging it. "No Developer ID
          # identity" has two very different causes - a .p12 with no private
          # key, and a .p12 holding the wrong certificate - and only the
          # list distinguishes them. Certificate names and Team IDs are
          # public, embedded in every signed app; the private key is never
          # printed by find-identity.
          FOUND=$(security find-identity -v -p codesigning "$KEYCHAIN")
          IDENTITY=$(printf '%s\n' "$FOUND" \
            | grep "Developer ID Application" | head -1 \
            | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "The .p12 in MACOS_CERT_P12 holds no \"Developer ID"
            echo "Application\" identity. What it does hold:"
            echo ""
            printf '%s\n' "$FOUND"
            echo ""
            echo "If that lists an \"Apple Development\" certificate, that is"
            echo "the wrong one - it signs builds for your own machines and"
            echo "cannot sign a public release. In Keychain Access, under My"
            echo "Certificates, export the row starting \"Developer ID"
            echo "Application:\" instead. The two rows sit next to each other"
            echo "and read almost alike."
            echo ""
            echo "If it lists nothing at all, the .p12 carries a certificate"
            echo "without its private key - re-export from My Certificates,"
            echo "not from All Items."
            exit 1
          fi
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "Signing as: $IDENTITY"

      # Nested code must be signed before the bundle that contains it, so
      # walk inside-out rather than relying on --deep, which Apple
      # discourages and which silently misses some layouts.
      #
      # Every Mach-O file, not a list of extensions. This used to match
      # only *.dylib and *.so, which misses executables that carry no
      # extension at all - imageio_ffmpeg ships exactly that, an `ffmpeg`
      # binary, and one unsigned executable anywhere inside the bundle is
      # enough for Apple to refuse the whole submission. Asking `file`
      # what each one is cannot go stale the way a list of suffixes does.
      #
      # Each signature carries a timestamp from Apple's server, which once
      # never answered (2.0.2: "A timestamp was expected but was not
      # found") and cost a re-run. ci/apple_retry.sh signs again when the
      # server is what failed, and fails at once on anything else.
      - name: Sign the app
        run: |
          APP=dist/StreamSync.app
          count=0
          while IFS= read -r -d '' f; do
            case "$(file -b "$f")" in
              *Mach-O*)
                ci/apple_retry.sh codesign --force --timestamp --options runtime \
                  --keychain "$KEYCHAIN" --sign "$IDENTITY" "$f"
                count=$((count + 1))
                ;;
            esac
          done < <(find "$APP" -depth -type f -print0)
          echo "Signed $count Mach-O file(s) inside the bundle."

          # sstap records this Mac's sound through a Core Audio tap, which
          # the hardened runtime counts as audio input. The app's
          # entitlements cover only the app's process, so the helper gets
          # its own (mac/sstap.entitlements) - signed again, after the loop
          # above signed it plain, and before the bundle seals it.
          ci/apple_retry.sh codesign --force --timestamp --options runtime \
            --entitlements mac/sstap.entitlements \
            --keychain "$KEYCHAIN" --sign "$IDENTITY" "$APP/Contents/MacOS/sstap"
          codesign -d --entitlements - --xml "$APP/Contents/MacOS/sstap" 2>/dev/null \
            | grep -q "com.apple.security.device.audio-input" \
            || { echo "sstap lacks the audio-input entitlement"; exit 1; }

          ci/apple_retry.sh codesign --force --timestamp --options runtime \
            --entitlements entitlements.plist \
            --keychain "$KEYCHAIN" --sign "$IDENTITY" "$APP"

          echo "--- verifying ---"
          codesign --verify --strict --deep --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "TeamIdentifier|Authority|Runtime"

          # Apple refuses the submission if anything inside is unsigned, and
          # says so only in the notarization log, minutes later. Catch it here.
          echo "--- checking nothing inside is left unsigned ---"
          unsigned=""
          while IFS= read -r -d '' f; do
            case "$(file -b "$f")" in
              *Mach-O*)
                codesign --verify --strict "$f" 2>/dev/null \
                  || unsigned="$unsigned$f\n" ;;
            esac
          done < <(find "$APP" -depth -type f -print0)
          if [ -n "$unsigned" ]; then
            echo "Unsigned Mach-O file(s) remain:"
            printf '%b' "$unsigned"
            exit 1
          fi
          echo "All Mach-O files carry a valid signature."

      # A missing entitlement fails nowhere in this job. Every release up
      # to 2.0.2 shipped without the Apple Events one, and the only sign
      # was a line in tccd's log on a user's Mac: the stream swap simply
      # never worked. So read back what the signature actually carries
      # and compare it with entitlements.plist, key for key.
      - name: Check the app carries every entitlement
        run: |
          codesign -d --entitlements - --xml dist/StreamSync.app \
            > "$RUNNER_TEMP/signed-entitlements.plist"
          python3 - "$RUNNER_TEMP/signed-entitlements.plist" entitlements.plist <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              got = plistlib.load(f)
          with open(sys.argv[2], "rb") as f:
              want = plistlib.load(f)
          for key in sorted(want):
              print(("  ok       " if got.get(key) == want[key] else
                     "  MISSING  ") + key)
          if any(got.get(k) != v for k, v in want.items()):
              sys.exit("The signed app lacks entitlements that "
                       "entitlements.plist asks for.")
          PY

      # A release whose updater cannot reach GitHub cannot be updated away
      # from, so prove the signed bundle completes a verified HTTPS request
      # before spending a notarization on it. Runs after signing because
      # the hardened runtime, not just the packaging, could break it.
      #
      # The second run blanks OpenSSL's default CA paths, which exist on
      # this runner only because it has a python.org Python installed. A
      # user's Mac has no such file, so this is the run that proves the
      # bundle's own roots are enough.
      - name: Verify the signed app can verify HTTPS
        timeout-minutes: 3
        run: |
          APP=dist/StreamSync.app/Contents/MacOS/StreamSync
          echo "--- as this runner is configured ---"
          "$APP" --netcheck
          echo "--- with OpenSSL's default CA paths taken away ---"
          out=$(SSL_CERT_FILE=/nonexistent/cert.pem \
                SSL_CERT_DIR=/nonexistent/certs "$APP" --netcheck)
          echo "$out"
          # Assert the bundle's own roots did the work. Two sources can
          # report the same certificate count, so without this the step
          # passes just as happily if the override stops applying and
          # OpenSSL's roots quietly carried the request after all.
          case "$out" in
            *"source: certifi"*) ;;
            *) echo "Expected the bundled certifi to supply the roots."
               exit 1 ;;
          esac

      # The report exists so a user on a machine we cannot reach can send
      # us one command's output. If it ever throws inside the bundle it
      # would do so exactly when someone is already stuck, so run it here
      # against the real .app rather than trusting the source checkout.
      - name: Verify the built app can report its own diagnostics
        timeout-minutes: 3
        run: |
          APP=dist/StreamSync.app/Contents/MacOS/StreamSync
          out=$("$APP" --diagnose)
          echo "$out"
          for want in "StreamSync diagnostics" "verdict:" "process_arch"; do
            case "$out" in
              *"$want"*) ;;
              *) echo "--diagnose output is missing: $want"; exit 1 ;;
            esac
          done

      # Notarize the app itself first and staple the ticket into the
      # bundle, so it still validates once dragged out of the disk image
      # and the image is gone.
      - name: Notarize and staple the app
        env:
          NOTARY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent dist/StreamSync.app "$RUNNER_TEMP/notarize.zip"
          NOTARY_KEY_FILE="$RUNNER_TEMP/notary.p8" \
            ci/notarize.sh "$RUNNER_TEMP/notarize.zip" dist/StreamSync.app

      # ci/make_dmg.sh retries hdiutil's intermittent "Resource busy"
      # on the runners instead of failing the whole build on it.
      - name: Package as a disk image
        run: ci/make_dmg.sh dist/StreamSync.app "StreamSync $VERSION" "$DMG"

      # Sign and notarize the image too: it is the thing that actually
      # gets downloaded, so Gatekeeper judges it first.
      - name: Sign, notarize and staple the disk image
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          ci/apple_retry.sh codesign --force --timestamp --keychain "$KEYCHAIN" \
            --sign "$IDENTITY" "$DMG"
          NOTARY_KEY_FILE="$RUNNER_TEMP/notary.p8" \
            ci/notarize.sh "$DMG" "$DMG"
          rm -f "$RUNNER_TEMP/notary.p8"

      # What a user's Mac will conclude on first launch, asserted here
      # rather than discovered by them.
      #
      # stapler validate asks CloudKit for the ticket again, and that
      # connection dropped here in 2.0.7, so it goes through
      # ci/apple_retry.sh like the stapling does.
      - name: Verify the image mounts and Gatekeeper accepts the app
        run: |
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -readonly
          test -x "$MNT/StreamSync.app/Contents/MacOS/StreamSync" \
            || { echo "main binary missing or not executable"; exit 1; }
          codesign --verify --strict --deep --verbose=2 "$MNT/StreamSync.app"
          ci/apple_retry.sh xcrun stapler validate "$MNT/StreamSync.app"
          spctl --assess --type execute --verbose=4 "$MNT/StreamSync.app"
          hdiutil detach "$MNT"

      # --clobber: a re-run replaces what an earlier, failed run attached.
      - name: Attach the disk image to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$DMG" --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    name: Windows
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ inputs.version || github.ref_name }}

  publish:
    name: Publish the release
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      # for ci/sign_sums.sh and the updater's own key and verifier
      - uses: actions/checkout@v7

      - name: Fetch the builds from the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "*.dmg" --pattern "*-windows-x64-*-setup.exe" --dir dist
          # One per platform - never publish half a release.
          for want in "*-arm64-*.dmg" "*-x86_64-*.dmg" "*-windows-x64-*-setup.exe"; do
            n=$(find dist -maxdepth 1 -name "$want" | wc -l)
            if [ "$n" -ne 1 ]; then
              echo "Expected one $want on the draft, found $n."
              exit 1
            fi
          done

      # The updater refuses any download it cannot match here, so a
      # release without this file installs nothing.
      - name: Checksum the builds
        working-directory: dist
        run: |
          sha256sum *.dmg *.exe | tee SHA256SUMS
          ls -lh

      # ...and refuses this file unless the release key signed it.
      - name: Sign the checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: bash ci/sign_sums.sh dist/SHA256SUMS

      # SHA256SUMS and its signature go up before the draft is published,
      # so there is no moment when the updater can see the release without
      # them.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          gh release upload "$TAG" dist/SHA256SUMS dist/SHA256SUMS.sig \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest
          echo "Published: $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url)"
