name: Windows release build

# Builds StreamSync's Windows installer for a release and attaches it to
# that release. The Release workflow calls this for every new version, and
# it can be run by hand (Actions > Windows release build > Run workflow) to
# add a Windows build to a release that went out without one - including
# one tagged before the installer existed: the app is built from the tag,
# and only the tooling the tag lacks (installer script, signing script)
# comes from the commit this workflow runs from.
#
# The download is a per-user installer (installer/StreamSync.iss): no admin
# prompt, into %LOCALAPPDATA%\Programs\StreamSync, which is where the app's
# updater replaces it from. It is not Authenticode-signed - there is no
# Windows signing certificate - so SmartScreen may warn on a first install
# from the browser; what proves an update came from us is the release's
# signed SHA256SUMS, which the app checks before it runs anything. The Mac
# updater only ever picks a .dmg, so the installer never reaches it.
#
# A pull request that changes this build runs it - including a real silent
# install and uninstall - without attaching anything, so a broken Windows
# build shows up before a release needs it.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Release to attach a Windows build to, e.g. v1.0.7"
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/build-windows.yml
      - build_exe.ps1
      - installer/**

permissions:
  contents: write

jobs:
  windows:
    name: Build (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # tags too, to rebuild a published release

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A new release has no tag yet - it is created when the draft is
      # published - so it builds the commit the Release workflow runs on.
      # A release that is already out is rebuilt from its own tag, not
      # from whatever main has become since. A tag from before the
      # installer existed has no installer script or signing script; those
      # are build tooling, not part of the app, so they come from this
      # workflow's own commit - only where the tag has none of its own.
      - name: Check out the release's commit
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.version }}
        run: |
          if [ "$EVENT" != "pull_request" ] &&
             git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "refs/tags/$TAG"
            for tool in installer/StreamSync.iss ci/sign_sums.sh; do
              if ! git cat-file -e "HEAD:$tool" 2>/dev/null; then
                git checkout -q "$GITHUB_SHA" -- "$tool"
                echo "$TAG has no $tool; using the one from $(git rev-parse --short "$GITHUB_SHA")."
              fi
            done
          fi
          FILE=$(python -c 'from version import __version__; print(__version__)')
          if [ "$EVENT" = "pull_request" ]; then
            TAG="v$FILE"
          elif [ "$FILE" != "${TAG#v}" ]; then
            echo "Tag $TAG means ${TAG#v}, but version.py says $FILE."
            exit 1
          fi
          # -setup.exe and -windows-x64- are what updater.pick_asset looks
          # for: keep both, or installed apps stop finding their updates
          BASE="StreamSync-$FILE-windows-x64-$(git rev-parse --short HEAD)-setup"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$FILE" >> "$GITHUB_ENV"
          echo "SETUP_BASE=$BASE" >> "$GITHUB_ENV"
          echo "SETUP=$BASE.exe" >> "$GITHUB_ENV"
          echo "Building StreamSync $FILE from $(git rev-parse --short HEAD)"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build StreamSync.exe
        shell: pwsh
        run: ./build_exe.ps1

      # The runner image comes with Inno Setup 6. An image without it gets
      # 6.7.3, the last 6.x, from Inno Setup's own GitHub release, checked
      # against the SHA-256 that release and its .issig file both give.
      # This used to be `choco install innosetup`, which would fail with
      # Chocolatey's feed down, and which now installs Inno Setup 7, into a
      # folder this step does not look in.
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
            $sha256 = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
            $exe = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
            for ($try = 1; ; $try++) {
              curl.exe --fail --silent --show-error --location --connect-timeout 30 `
                --max-time 300 --output $exe $url
              if ($LASTEXITCODE -eq 0 -and
                  (Get-FileHash $exe -Algorithm SHA256).Hash -eq $sha256) { break }
              if ($try -ge 4) { throw "No good copy of Inno Setup 6.7.3 in 4 tries." }
              "Download $try of 4 failed or did not match; trying again."
              Start-Sleep -Seconds (15 * $try)
            }
            $p = Start-Process $exe -Wait -PassThru -ArgumentList '/VERYSILENT',
                   '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$(Split-Path $iscc)`""
            if ($p.ExitCode -ne 0) { throw "Inno Setup's installer exited $($p.ExitCode)" }
            if (-not (Test-Path $iscc)) { throw "Inno Setup installed, but there is no $iscc" }
            "Installed Inno Setup 6.7.3"
          }
          & $iscc /Q "/DAppVersion=$env:VERSION" "/DOutputBase=$env:SETUP_BASE" installer\StreamSync.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item "dist\$env:SETUP" $env:SETUP
          "{0}: {1:N0} MB" -f $env:SETUP, ((Get-Item $env:SETUP).Length / 1MB)

      # The installer as a user gets it: silent install for this user, no
      # admin, then the installed app asked one question (--netcheck runs
      # before anything needs VLC, so this runner can answer it), then a
      # silent uninstall that must leave nothing behind.
      - name: Try the installer
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\StreamSync"
          $p = Start-Process ".\$env:SETUP" -Wait -PassThru `
                 -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          if (-not (Test-Path "$dir\StreamSync.exe")) { throw "no StreamSync.exe in $dir" }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{DD7E9DD2-921F-4429-9816-2D38D54DF06B}_is1'
          $shown = (Get-ItemProperty $key).DisplayVersion
          if ($shown -ne $env:VERSION) { throw "installed as version '$shown', not $env:VERSION" }
          $run = Start-Process "$dir\StreamSync.exe" -ArgumentList '--netcheck' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "the installed app's --netcheck exited $($run.ExitCode)" }
          $p = Start-Process "$dir\unins000.exe" -Wait -PassThru `
                 -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($p.ExitCode -ne 0) { throw "uninstaller exited $($p.ExitCode)" }
          # the uninstaller finishes from a temporary copy of itself
          for ($i = 0; $i -lt 30 -and (Test-Path $dir); $i++) { Start-Sleep 1 }
          if (Test-Path $dir) { throw "uninstall left $dir behind" }
          if (Test-Path $key) { throw "uninstall left its registry entry" }
          "Installed $env:VERSION per user, ran it, uninstalled cleanly."

      # --clobber: a re-run replaces what an earlier, failed run attached.
      - name: Attach the installer to the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$SETUP" --repo "$GITHUB_REPOSITORY" --clobber

      # A draft gets its SHA256SUMS (and signature) from the Release
      # workflow's publish job, which checksums everything attached. A
      # release that is already published keeps its disk images' lines
      # exactly as they are, gains one for the installer, and is signed
      # again - an old signature cannot cover the new line.
      - name: Add the installer to a published release's SHA256SUMS
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          PYTHON: python
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)
          if [ "$draft" != "false" ]; then
            echo "$TAG is a draft; its publish job writes SHA256SUMS."
            exit 0
          fi
          mkdir -p sums
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir sums --clobber
          # In Python, not print-and-redirect: text-mode stdout on Windows
          # would end the new line in \r\n, and sha256sum -c elsewhere
          # would then look for a file whose name ends in \r.
          python - <<'EOF'
          import hashlib, os
          setup = os.environ["SETUP"]
          old = open("sums/SHA256SUMS", encoding="utf-8").read().splitlines()
          keep = [l for l in old if l.strip() and "-windows-x64-" not in l]
          digest = hashlib.sha256(open(setup, "rb").read()).hexdigest()
          new = keep + [f"{digest}  {setup}"]
          if [l for l in new if ".dmg" in l] != [l for l in old if ".dmg" in l]:
              raise SystemExit("The disk images' checksums changed; not uploading.")
          with open("SHA256SUMS", "w", encoding="utf-8", newline="\n") as f:
              f.write("\n".join(new) + "\n")
          print("\n".join(new))
          EOF
          # sign_sums.sh checks the secret against updater.RELEASE_KEY with
          # sigcheck. A tag from before signed releases has neither, so take
          # both from this workflow's commit. The app is already built and
          # packed by now, so this changes nothing that ships.
          if ! git cat-file -e HEAD:sigcheck.py 2>/dev/null ||
             ! git grep -q '^RELEASE_KEY' HEAD -- updater.py; then
            git checkout -q "$GITHUB_SHA" -- sigcheck.py updater.py
          fi
          bash ci/sign_sums.sh SHA256SUMS
          gh release upload "$TAG" SHA256SUMS SHA256SUMS.sig \
            --repo "$GITHUB_REPOSITORY" --clobber
